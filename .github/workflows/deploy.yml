# .github/workflows/deploy.yml
name: Deploy Post Radar PWA to GitHub Pages

on:
  push:
    branches: ['master']
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build Vite PWA for GitHub Pages
        env:
          # Automatically configures Vite base path to /<repo-name>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Pulls the Cloudflare Worker URL securely from GitHub Repository Secrets
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          npm run build
          # Copy index.html to 404.html so client-side SPA routing works on hard refresh
          cp dist/index.html dist/404.html
          # Prevent Jekyll processing on GitHub Pages
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
